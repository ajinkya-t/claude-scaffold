_subdirectory: template
_min_copier_version: "9.0.0"

_skip_if_exists:
  - "CLAUDE.md"
  - "AGENTS.md"
  - ".gitignore"
  - "README.md"
  - ".pre-commit-config.yaml"
  - ".mcp.json"
  - ".claude/settings.json"
  - "LICENSE"

_tasks:
  # When Superpowers is on, drop the redundant commands and subagents.
  # /plan and /tdd ship as plain .md (no model interpolation needed).
  # /review and code-reviewer/test-writer/debugger ship as .md after Jinja stripping.
  - "{% if enable_superpowers %}rm -f .claude/commands/plan.md .claude/commands/tdd.md .claude/commands/review.md .claude/agents/code-reviewer.md .claude/agents/test-writer.md .claude/agents/debugger.md{% endif %}"
  # When Superpowers is off, drop the integration skills, the routing skill, the spec-review hook, and all 12 tier-pinned shims.
  - "{% if not enable_superpowers %}rm -rf .claude/skills/design-review .claude/skills/spec-security-review .claude/skills/routing .claude/commands/review-with-superpowers.md .claude/commands/brainstorm.md .claude/commands/sp-plan.md .claude/commands/sp-debug.md .claude/commands/sp-skill.md .claude/commands/sp-worktree.md .claude/commands/sp-implement.md .claude/commands/sp-subagent.md .claude/commands/sp-tdd.md .claude/commands/sp-review-request.md .claude/commands/sp-review-receive.md .claude/commands/sp-finish.md .claude/commands/sp-verify.md .claude/hooks/spec-review-trigger.sh{% endif %}"
  - "{% if git_init %}command -v git >/dev/null 2>&1 || { echo 'git not installed; skipping git_init'; exit 0; }; git init -q && git add -A && git commit -q -m 'chore: scaffold from claude-scaffold'{% endif %}"
  - "{% if pre_commit %}pre-commit install -q 2>/dev/null || echo 'pre-commit not installed; run: uvx pre-commit install'{% endif %}"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: Project name (kebab-case)
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}Must be lowercase kebab-case (no leading/trailing/double hyphens){% endif %}"

project_description:
  type: str
  help: One-line description
  default: ""

# ---------------------------------------------------------------------------
# Stack
# ---------------------------------------------------------------------------

language:
  type: str
  help: Primary language
  choices:
    - python
    - typescript
    - go
    - rust
    - polyglot
  default: python

framework:
  type: str
  help: Framework (or 'none')
  default: none
  when: "{{ language in ['python', 'typescript'] }}"
  choices:
    fastapi: fastapi
    django: django
    flask: flask
    next: next
    express: express
    none: none

package_manager:
  type: str
  help: Package manager
  default: "{% if language == 'python' %}uv{% elif language == 'typescript' %}pnpm{% elif language == 'rust' %}cargo{% elif language == 'go' %}go-mod{% else %}none{% endif %}"
  choices:
    - uv
    - poetry
    - pip
    - pnpm
    - npm
    - bun
    - cargo
    - go-mod
    - none

# ---------------------------------------------------------------------------
# Agent file strategy
# ---------------------------------------------------------------------------

agents_file_strategy:
  type: str
  help: |
    AGENTS.md is vendor-neutral (Codex, Cursor, Aider read it too).
    'agents-md-symlink' = AGENTS.md is canonical, CLAUDE.md is a 2-line @import. RECOMMENDED.
    'claude-md' = CLAUDE.md only. Vendor-locked.
  choices:
    - agents-md-symlink
    - claude-md
  default: agents-md-symlink

# ---------------------------------------------------------------------------
# MCPs (multi-select)
# ---------------------------------------------------------------------------

mcps:
  type: str
  help: "MCP servers to enable (default safe pair = github, filesystem)"
  default:
    - github
    - filesystem
  multiselect: true
  choices:
    - github
    - filesystem
    - postgres
    - sqlite
    - playwright
    - supabase
    - ref
    - chrome-devtools

chrome_extension:
  type: bool
  help: |
    Enable Claude in Chrome extension recommendation in README.
    Boris Cherny: 'I use the extension every time I work on frontend.'
  default: "{% if framework in ['next', 'express'] or language == 'typescript' %}true{% else %}false{% endif %}"

# ---------------------------------------------------------------------------
# Hooks (all four are battle-tested defaults)
# ---------------------------------------------------------------------------

hooks:
  type: str
  help: "Hooks to install (default: core five + spec-review-trigger when superpowers on)"
  default:
    - block-secret-edits
    - block-dangerous-bash
    - tests-before-pr
    - route-perms-to-opus
    - warn-on-lockfile-edit
    - spec-review-trigger
  multiselect: true
  choices:
    - block-secret-edits
    - block-dangerous-bash
    - tests-before-pr
    - route-perms-to-opus
    - warn-on-lockfile-edit
    - spec-review-trigger
    - notify-on-stop

# ---------------------------------------------------------------------------
# Subagents
# ---------------------------------------------------------------------------

subagents:
  type: str
  help: "Subagents to install (default: all four)"
  default:
    - code-reviewer
    - test-writer
    - debugger
    - security-auditor
  multiselect: true
  choices:
    - code-reviewer
    - test-writer
    - debugger
    - security-auditor

# ---------------------------------------------------------------------------
# Output style
# ---------------------------------------------------------------------------

output_style:
  type: str
  help: Default output style
  default: concise
  choices:
    - default
    - concise
    - mentor

# ---------------------------------------------------------------------------
# Model routing
#
# Three task tiers mapped to three model aliases. Every command, agent, hook,
# and CI workflow that pins a model derives it from these three variables,
# so changing the routing in one place flows everywhere.
#
# Tiers:
#   high — architecture, security review, permission-hook scanning
#   mid  — plan, iterate, refactor, code review, default for ad-hoc sessions
#   low  — /commit, /techdebt, mechanical formatting/cleanup
#
# Defaults use Claude Code's model aliases ('opus', 'sonnet', 'haiku'), which
# auto-resolve to the latest stable version of each family. If you need
# reproducibility (e.g., a long-running CI job whose behavior must not drift
# when a new model lands), pin a specific ID instead — e.g., set model_high
# to 'claude-opus-4-7' after rendering. Aliases are recommended for most
# users because they avoid forced version bumps.
# ---------------------------------------------------------------------------

model_routing:
  type: str
  help: |
    'latest'      = opus (high), sonnet (mid), haiku (low) — tracks current stable
    'sonnet-only' = sonnet for all three tiers (single-model setup)
    'opus-heavy'  = opus (high+mid), sonnet (low) — bias toward depth
  choices:
    - latest
    - sonnet-only
    - opus-heavy
  default: latest

enable_1m_context:
  type: bool
  help: |
    Append the `[1m]` alias suffix to Opus and Sonnet tiers (Haiku has no 1M).
    The `[1m]` alias is Claude Code's canonical way to request the 1M-token context
    window on Opus 4.6+/4.7 and Sonnet 4.6 (per docs: model-config#extended-context).
    Pricing: standard rates beyond 200K (no per-token premium). Subscription plans
    (Pro/Max) may meter Sonnet 1M as 'extra usage' quota. Override at runtime with
    CLAUDE_CODE_DISABLE_1M_CONTEXT=1.
  default: true

# Tier -> model alias. Computed from model_routing; the rest of the template
# only references model_high, model_mid, model_low.
model_high:
  type: str
  when: false
  default: "{% if model_routing == 'latest' or model_routing == 'opus-heavy' %}opus{% else %}sonnet{% endif %}{% if enable_1m_context %}[1m]{% endif %}"

model_mid:
  type: str
  when: false
  default: "{% if model_routing == 'opus-heavy' %}opus{% else %}sonnet{% endif %}{% if enable_1m_context %}[1m]{% endif %}"

# Haiku does not support 1M context — no [1m] suffix when low resolves to haiku.
model_low:
  type: str
  when: false
  default: "{% if model_routing == 'latest' %}haiku{% else %}sonnet{% if enable_1m_context %}[1m]{% endif %}{% endif %}"

# ---------------------------------------------------------------------------
# Methodology layers (opt-in)
# ---------------------------------------------------------------------------

enable_superpowers:
  type: bool
  help: |
    True if you have installed a Superpowers plugin (see superpowers_source).
    When true: drops commands/subagents that overlap with Superpowers (plan, tdd,
    review, code-reviewer, test-writer, debugger), ships design-review and
    spec-security-review skills, the spec-review-trigger hook, the routing skill,
    and 12 tier-pinned slash shims for the most-used Superpowers skills.
  default: false

superpowers_source:
  type: str
  help: |
    Which Superpowers plugin to install/integrate with.
    'pcvelz' (recommended) = pcvelz/superpowers — fork with native Claude Code task
      management (TaskCreate w/ json:metadata, dependency enforcement,
      pre-commit task gate, cross-session resume). Skill prefix is
      `superpowers-extended-cc:`.
    'obra' = obra/superpowers — upstream, cross-platform (CC/Codex/OpenCode/Gemini).
      Skill prefix is `superpowers:`.
  choices:
    - pcvelz
    - obra
  default: pcvelz
  when: "{{ enable_superpowers }}"

# Computed: prefix used inside slash shims and hook reminders.
sp_prefix:
  type: str
  when: false
  default: "{% if superpowers_source == 'obra' %}superpowers{% else %}superpowers-extended-cc{% endif %}"

# Computed: install snippet shown in README.
sp_install_url:
  type: str
  when: false
  default: "{% if superpowers_source == 'obra' %}obra/superpowers-marketplace{% else %}pcvelz/superpowers{% endif %}"

sp_install_target:
  type: str
  when: false
  default: "{% if superpowers_source == 'obra' %}superpowers@superpowers-marketplace{% else %}superpowers-extended-cc@superpowers-extended-cc-marketplace{% endif %}"

enable_bmad:
  type: bool
  help: |
    Add BMAD Method README pointer for spec-driven development.
    Useful for substantial/security-sensitive features. Sits ABOVE Explore->Plan->Implement, not as a replacement.
  default: false

# ---------------------------------------------------------------------------
# CI / pre-commit
# ---------------------------------------------------------------------------

ci_review:
  type: bool
  help: Ship .github/workflows/claude-review.yml and claude-techdebt.yml (uses claude -p headless mode)
  default: true

pre_commit:
  type: bool
  help: Install pre-commit hooks (ruff/prettier/gitleaks)
  default: true

git_init:
  type: bool
  help: Run git init and create initial commit
  default: true

# ---------------------------------------------------------------------------
# License
# ---------------------------------------------------------------------------

license:
  type: str
  help: License
  choices:
    - MIT
    - Apache-2.0
    - proprietary
  default: MIT

author_name:
  type: str
  help: Author name (for LICENSE)
  default: ""

author_email:
  type: str
  help: Author email (optional)
  default: ""
